<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>three.js: World Effects</title>
    <meta itemprop="name" content="three.js: World Effects">
    <meta name="twitter:title" content="three.js: World Effects">
    <meta property="og:title" content="three.js: World Effects">
    <meta property="og:site_name" content="three.js: World Effects">
    <meta name="description" content="Minimal project showing simple cube placed in the world">
    <meta itemprop="description" content="Minimal project showing simple cube placed in the world">
    <meta property="og:description" content="Minimal project showing simple cube placed in the world">
    <meta name="twitter:description" content="Minimal project showing simple cube placed in the world">
    <meta property="og:image" content="https://8thwall.org/threejs-world-effects-example/preview.jpg"/>

    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="src/index.css">
  </head>
  <body>
    <!-- Toggle button that opens the shape-picker popup. -->
    <button id="shape-toggle" aria-label="Pilih bangun ruang" aria-expanded="false">&#9881;</button>

    <!-- Popup with dropdowns to pick which materi and which 3D shape is displayed. -->
    <div id="shape-popup" class="hidden">
      <label for="materi-select">Pilih Materi</label>
      <select id="materi-select">
        <option value="1" selected>1. Klasifikasi Bangun Ruang Sisi Datar</option>
        <option value="2">2. Jaring-Jaring Bangun Ruang Sisi Datar</option>
        <option value="3">3. Luas Permukaan Kubus, Balok, dan Prisma</option>
        <option value="4">4. Luas Permukaan Limas</option>
        <option value="5">5. Skala dan Luas Bangun Ruang Sisi Datar</option>
        <option value="6">6. Volume Kubus, Balok, dan Prisma</option>
        <option value="7">7. Volume Limas</option>
        <option value="8">8. Skala dan Volume Bangun Ruang Sisi Datar</option>
      </select>

      <label for="shape-select">Pilih Bangun Ruang</label>
      <select id="shape-select">
        <option value="kubus" selected>Kubus</option>
        <option value="balok">Balok</option>
        <option value="prisma-segitiga">Prisma Segitiga</option>
        <option value="prisma-segilima">Prisma Segilima</option>
        <option value="limas-segitiga">Limas Segitiga</option>
        <option value="limas-segilima">Limas Segilima</option>
      </select>

      <!-- Only shown for materi 2 (jaring-jaring): lets the user drag the net open by hand. -->
      <div id="net-slider-wrap" class="hidden">
        <label for="net-slider">Buka Jaring-Jaring (<span id="net-slider-value">0</span>%)</label>
        <input type="range" id="net-slider" min="0" max="100" value="0">
      </div>
    </div>

    <!-- The main canvas used for drawing by the app. -->
    <canvas id="camerafeed"></canvas>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
